<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%PRODUCT_NAME%</title>
    <!--
      The theme class is set here, inline and before the stylesheet, rather than
      by `theme.ts` after React mounts. A module script runs after first paint,
      so a dark-mode operator would get a full white flash on every cold load —
      the page has to already know which theme it is before it paints anything.

      This duplicates `resolveTheme`/`applyTheme` in ~6 lines on purpose: it
      cannot import them (no bundler has run yet), and the alternative to the
      duplication is the flash. Keep it in step with `src/console/theme.ts`.
    -->
    <script>
      try {
        var choice = localStorage.getItem('theme') || 'system';
        var dark = choice === 'dark'
          || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      } catch (e) {
        // Storage blocked. The page still renders; it just starts on the OS
        // preference, which is what `system` would have chosen anyway.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
