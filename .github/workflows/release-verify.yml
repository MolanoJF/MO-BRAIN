name: release-verify

# Task 18 Step 4 — Gate A's assertion once more, against the actual release.
# Runs on a fresh GitHub runner that did not build the images, pulls each
# published artifact BY DIGEST (not by tag), and starts it. The digest is the
# release; the tag is a label someone can move. Inputs default to v1.0.0.
on:
  workflow_dispatch:
    inputs:
      gbrain_base:
        description: 'gbrain-base image reference (by digest)'
        required: true
        default: 'ghcr.io/molanojf/gbrain-base@sha256:83c6e585681be27a15fa476b7307991ef0fb5334c92175686831008c60bfca0e'
      control_plane:
        description: 'control-plane image reference (by digest)'
        required: true
        default: 'ghcr.io/molanojf/control-plane@sha256:e6d9ecab9ce59f3762364098c12be850a12e743428db33fcdca62e0849e1a2ba'
      agent_runner:
        description: 'agent-runner image reference (by digest)'
        required: true
        default: 'ghcr.io/molanojf/agent-runner@sha256:55372d5e8b80277c55004a14d9fe0db2ac35dc1f94ed5c83a2897b935e80e950'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR to pull the published images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and start gbrain-base by digest
        run: |
          set -euo pipefail
          IMG='${{ inputs.gbrain_base }}'
          docker pull "$IMG"
          docker inspect --format 'pulled {{index .RepoDigests 0}}' "$IMG"
          docker run --rm "$IMG" gbrain --version

      - name: Pull and start control-plane by digest
        run: |
          set -euo pipefail
          IMG='${{ inputs.control_plane }}'
          docker pull "$IMG"
          docker inspect --format 'pulled {{index .RepoDigests 0}}' "$IMG"
          docker run --rm "$IMG" bun --version

      - name: Pull and start agent-runner by digest
        run: |
          set -euo pipefail
          IMG='${{ inputs.agent_runner }}'
          docker pull "$IMG"
          docker inspect --format 'pulled {{index .RepoDigests 0}}' "$IMG"
          docker run --rm "$IMG" claude --version
