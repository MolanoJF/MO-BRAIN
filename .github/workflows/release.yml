name: release

# Task 5 (moved): the three pinned images publish ONLY here. A `v*` tag or an
# explicit dispatch is a release; an ordinary push to main is not. This is what
# stops the published digests from moving under the docs on every merge.
# It runs stack.yml (all suites) first; nothing is published unless the stack is green.
#
# "A release is its digests, not its tag." This job prints the three full
# RepoDigests and writes them into the GitHub Release body, so the record of a
# release lives with the release itself. Re-running a release rebuilds the
# images and therefore mints NEW digests (the builds are not bit-reproducible);
# the release body is overwritten with the newest set, and the older set stays
# in that run's log. G1 still holds: exact pins only, never a moving tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'APP_VERSION to publish and release (exact x.y.z[.w]; blank = 1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Prove the stack before anything is published. This is the one place the
  # full Docker suite runs without a human dispatching it.
  stack:
    uses: ./.github/workflows/stack.yml
    with:
      suite: all
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    needs: stack
    timeout-minutes: 60
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: molanojf
      GBRAIN_VERSION: '0.50.5.0'
      HARNESS_VERSION: '2.1.274'
      # A dispatch may name the version; a tag push keeps the frozen pin.
      APP_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # `set -o pipefail` is required or tee's exit 0 masks a failed build/push.
      - name: Publish the three pinned images
        run: |
          set -o pipefail
          bash scripts/publish-images.sh 2>&1 | tee publish-output.txt
      - name: Capture and print the three full RepoDigests
        id: digest
        run: |
          set -euo pipefail
          base=$(grep -oE 'ghcr\.io/molanojf/gbrain-base@sha256:[0-9a-f]{64}' publish-output.txt | tail -1)
          control=$(grep -oE 'ghcr\.io/molanojf/control-plane@sha256:[0-9a-f]{64}' publish-output.txt | tail -1)
          runner=$(grep -oE 'ghcr\.io/molanojf/agent-runner@sha256:[0-9a-f]{64}' publish-output.txt | tail -1)
          for ref in "$base" "$control" "$runner"; do
            [ -n "$ref" ] || { echo "missing a RepoDigest in publish-output.txt" >&2; exit 1; }
          done
          echo "gbrain-base   ${base}"
          echo "control-plane ${control}"
          echo "agent-runner  ${runner}"
          {
            echo "base=$base"
            echo "control=$control"
            echo "runner=$runner"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published digests"
            echo ""
            echo "| Image | RepoDigest |"
            echo "|---|---|"
            echo "| \`gbrain-base\` | \`${base}\` |"
            echo "| \`control-plane\` | \`${control}\` |"
            echo "| \`agent-runner\` | \`${runner}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the release tag
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the GitHub Release with the digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          BASE: ${{ steps.digest.outputs.base }}
          CONTROL: ${{ steps.digest.outputs.control }}
          RUNNER: ${{ steps.digest.outputs.runner }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Mobrain ${TAG} — the three pinned images, built and pushed by
          [release.yml](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml)
          at the exact pins (gbrain \`${GBRAIN_VERSION}\`, harness \`${HARNESS_VERSION}\`, app \`${APP_VERSION}\`).

          **A release is its digests, not its tag.** The tag is a label someone can
          move; these three \`RepoDigest\`s are the immutable artifacts.

          | Image | Tag | RepoDigest |
          |---|---|---|
          | \`gbrain-base\` | \`${GBRAIN_VERSION}\` | \`${BASE}\` |
          | \`control-plane\` | \`${APP_VERSION}\` | \`${CONTROL}\` |
          | \`agent-runner\` | \`${HARNESS_VERSION}\` | \`${RUNNER}\` |

          Verified from a fresh runner that did not build them by
          [release-verify.yml](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release-verify.yml)
          (dispatch it; it pulls all three by digest and starts them).

          > Re-running the release rebuilds the images, and the builds are not
          > bit-reproducible, so the digests above are replaced by the newest set.
          > This body is the record of the current release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Mobrain ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Mobrain ${TAG}" --notes-file release-notes.md
          fi

  # Catches the exact regression a from-scratch install dry run once hit: the
  # three GHCR packages got flipped to private, so `docker compose ... pull`
  # (no credentials, exactly what scripts/install.sh runs) failed `denied` for
  # everyone, even though README advertises a one-line anonymous install.
  # `publish`'s own docker/login-action call is scoped to THAT job's runner
  # only — GitHub Actions gives every job a fresh VM, so this job starts with
  # no ghcr.io credential in scope. check-public-images.sh also `docker
  # logout`s first, belt-and-braces, so this stays true even if a future edit
  # adds a login step above it in this same job.
  verify-public:
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: molanojf
      GBRAIN_VERSION: '0.50.5.0'
      HARNESS_VERSION: '2.1.274'
      APP_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the three pinned images are publicly, anonymously pullable
        run: bash scripts/ci/check-public-images.sh
