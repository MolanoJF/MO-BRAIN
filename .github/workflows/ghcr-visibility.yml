name: ghcr-visibility

# Package visibility on GHCR is a setting the release pipeline does not own —
# nobody flips it back to private through this repo's CI, so this repo's CI is
# also the only thing that will ever notice if it happens (a package deleted
# and recreated defaults to private; so does an accidental manual toggle in
# the GitHub UI). release.yml's own `verify-public` job only proves the images
# were public at THE MOMENT they were just published; it cannot catch a
# regression that happens weeks later with no new release. This workflow is
# that ongoing check: same anonymous-pull test, run on a schedule against
# whatever is live right now, independent of any release event.
#
# It never logs in to ghcr.io (see scripts/ci/check-public-images.sh) — the
# whole point is to prove what an external, credential-less `docker compose
# pull` (scripts/install.sh) actually sees.
on:
  schedule:
    - cron: '43 6 * * *' # daily, offset from nightly.yml's 05:17 slot
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: molanojf
      GBRAIN_VERSION: '0.50.5.0'
      HARNESS_VERSION: '2.1.274'
      APP_VERSION: '1.0.0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the three pinned images are publicly, anonymously pullable
        id: check
        run: bash scripts/ci/check-public-images.sh
      - name: Open or update an issue on regression
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'ghcr: a pinned image package is no longer publicly pullable'
        run: |
          set -euo pipefail
          gh label create release --color 0E8A16 \
            --description "release process / published artifacts" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" \
                     --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "The scheduled ghcr-visibility check found at least one of the three pinned" \
            "images (gbrain-base, control-plane, agent-runner) is no longer publicly," \
            "anonymously pullable from GHCR." \
            "" \
            "This breaks the one-line anonymous install README.md advertises: an" \
            "external user's \`docker compose ... pull\` gets \`denied\`, exactly the" \
            "failure a from-scratch install dry run hit when the packages were manually" \
            "set to private." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "Fix: for each affected package, GitHub -> molanojf's packages -> <name> ->" \
            "Package settings -> Danger Zone -> Change visibility -> Public.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label release
          fi
