name: nightly

# Task 13 — the drift tripwire with teeth (D10). The pinned-current arm stays
# blocking; the pinned-next arm is a tripwire: on failure it opens (or updates,
# never duplicates) one GitHub issue naming the failing tests and the run URL.
on:
  schedule:
    # Nightly drift detection against pinned-current AND pinned-next (G1/G4).
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      # Task 13 Step 3: dispatch a version that does not exist (e.g. 0.99.0.0)
      # so the base build fails and the drift issue step is proven to fire.
      gbrain_version:
        description: 'Override the pinned-next arm (blank keeps 0.51.0.0)'
        required: false
        default: ''
        type: string

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # pinned-current is the supported version; pinned-next is the tripwire.
        # A dispatch may replace the next arm to prove the tripwire fires.
        gbrain: ["0.50.5.0", "${{ inputs.gbrain_version || '0.51.0.0' }}"]
    continue-on-error: ${{ matrix.gbrain != '0.50.5.0' }}
    env:
      PINNED_CURRENT: '0.50.5.0'
      GBRAIN_VERSION: ${{ matrix.gbrain }}
      HARNESS_VERSION: '2.1.274'
      APP_VERSION: '1.0.0'
      DOMAIN: localhost
      POSTGRES_PASSWORD: ci-not-a-real-secret
      OPS_RPC_TOKEN: ci-not-a-real-token
      # Host-side contract tests target the live main stack.
      OPS_RPC_URL: http://127.0.0.1:3140
      ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters-long
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      CONTROL_DATABASE_URL: postgres://gbrain:ci-not-a-real-secret@localhost:5432/control
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain
          POSTGRES_PASSWORD: ci-not-a-real-secret
          POSTGRES_DB: control
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain -d control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      # The seam-gate contract legs shell `docker compose --env-file .env …`;
      # materialize one from the job environment (never committed).
      - name: Materialize .env for the live-stack contract legs
        run: |
          {
            echo "DOMAIN=${DOMAIN}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "OPS_RPC_TOKEN=${OPS_RPC_TOKEN}"
            echo "ENCRYPTION_KEY=${ENCRYPTION_KEY}"
            echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
            echo "GBRAIN_VERSION=${GBRAIN_VERSION}"
            echo "HARNESS_VERSION=${HARNESS_VERSION}"
            echo "APP_VERSION=${APP_VERSION}"
            echo "IMAGE_REGISTRY=ghcr.io"
            echo "IMAGE_NAMESPACE=molanojf"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
          } > .env
      - name: Build the pinned base image
        run: |
          docker build -f docker/gbrain-base.Dockerfile \
            --build-arg "GBRAIN_VERSION=${GBRAIN_VERSION}" \
            -t "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-molanojf}/gbrain-base:${GBRAIN_VERSION}" .
      - name: "Mirror the base and build the stack through the overlay (D2)"
        run: |
          docker tag "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-molanojf}/gbrain-base:${GBRAIN_VERSION}" \
            "mobrain/gbrain-base:${GBRAIN_VERSION}"
          docker compose -f compose/docker-compose.yml -f compose/docker-compose.build.yml build \
            --build-arg "GBRAIN_VERSION=${GBRAIN_VERSION}" \
            --build-arg "HARNESS_VERSION=${HARNESS_VERSION}" \
            control-plane scheduler agent-runner
      - name: Mirror the agent-runner under the bare name the contract test runs
        run: |
          docker tag "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-molanojf}/agent-runner:${HARNESS_VERSION}" \
            "mobrain/agent-runner:${HARNESS_VERSION}"
      - name: Bring the dev stack up on the pinned images
        run: docker compose -f compose/docker-compose.yml -f compose/docker-compose.dev.yml up -d --wait
      # tee so the failing test names survive into the issue body below. One
      # process per file: mock.module() is process-global (see test-isolated.sh).
      # `pipefail` is required or `tee`'s exit 0 masks every failure.
      - name: Run the contract suite
        run: |
          set -o pipefail
          bun run test:contract:isolated 2>&1 | tee contract-output.txt
      - name: Open or update a drift issue
        if: failure() && matrix.gbrain != '0.50.5.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "drift: gbrain ${{ matrix.gbrain }} breaks the contract suite"
        run: |
          set -euo pipefail
          # A tripwire nobody has ever seen fire is a tripwire nobody knows is
          # connected — and the label must exist before `gh issue create` uses it.
          gh label create drift --color B60205 \
            --description "pinned-next contract drift" --force >/dev/null 2>&1 || true
          # Never duplicate: one open issue per drifting version, updated nightly.
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" \
                     --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "Nightly pinned-next run failed against gbrain \`${{ matrix.gbrain }}\`." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Pinned-current (\`$PINNED_CURRENT\`) is unaffected; this is a tripwire, not an outage." \
            "" \
            "Failing tests:" \
            "\`\`\`" \
            "$(grep -E '^\(fail\)' contract-output.txt | head -50 || echo 'see the run log')" \
            "\`\`\`" \
            "" \
            "G1 holds: do not move the pin to make this pass. Fix the seam or widen the contract test.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label drift
          fi
