# Mobrain production stack. Caddy is the sole ingress; nothing else
# publishes a host port.
name: ${COMPOSE_PROJECT_NAME:-brainstand}

x-gbrain-env: &gbrain-env
  GBRAIN_DATABASE_URL: postgres://gbrain:${POSTGRES_PASSWORD:?required}@postgres:5432/gbrain
  GBRAIN_HOME: /srv/gbrain-home
  GBRAIN_SELF_UPGRADE_MODE: "off"
  # Task 6: deterministic regardless of how `~` resolves per-container —
  # ops reads exactly this path, gbrain-worker's supervisor writes exactly
  # this path, both already share the gbrain-home volume (S2 unchanged).
  GBRAIN_AUDIT_DIR: /srv/gbrain-home/.gbrain/audit

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gbrain-serve, control-plane]
    # D6: Caddy is the ONLY route into gbrain for the runner, and it is the
    # one member of runner-net that answers to the public name. Long form
    # (not a list) because only the long form can carry an alias.
    networks:
      brain-net:
      control-net:
      runner-net:
        aliases:
          - ${DOMAIN}

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    # No published host port.
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [brain-net, control-net]

  gbrain-serve:
    image: mobrain/gbrain-base:${GBRAIN_VERSION:?required}
    restart: unless-stopped
    environment:
      <<: *gbrain-env
      # Required behind Caddy: the default is `loopback`, and in compose the
      # proxy is a peer container, so without this every client IP collapses
      # to Caddy's and the pre-auth rate limiter mis-buckets.
      GBRAIN_HTTP_TRUST_PROXY: "1"
    command: ["gbrain", "serve", "--http", "--bind", "0.0.0.0", "--port", "3131",
              "--public-url", "https://${DOMAIN}"]
    volumes:
      - gbrain-home:/srv/gbrain-home
      - brain-repos:/srv/brain-repos
    depends_on:
      postgres: { condition: service_healthy }
    networks: [brain-net]

  gbrain-worker:
    image: mobrain/gbrain-base:${GBRAIN_VERSION:?required}
    restart: unless-stopped
    environment: *gbrain-env
    command: ["gbrain", "jobs", "supervisor", "--concurrency", "${WORKER_CONCURRENCY:-2}"]
    # V5: SIGTERM drains; `stop` waits up to 40s. Give it room plus margin.
    stop_grace_period: 60s
    volumes:
      - gbrain-home:/srv/gbrain-home
      - brain-repos:/srv/brain-repos
    depends_on:
      postgres: { condition: service_healthy }
    networks: [brain-net]

  # S2: the privilege boundary. Holds brain DB creds (required by V8) and RW
  # GBRAIN_HOME; exposes only the allowlisted RPC on the private network.
  gbrain-ops:
    image: mobrain/control-plane:${MOBRAIN_VERSION:-${BRAINSTAND_VERSION:-dev}}
    build:
      context: ..
      dockerfile: docker/control-plane.Dockerfile
      args:
        GBRAIN_VERSION: ${GBRAIN_VERSION:?required}
    restart: unless-stopped
    environment:
      <<: *gbrain-env
      OPS_RPC_TOKEN: ${OPS_RPC_TOKEN:?required}
      # The advisory lock for the file plane lives in the CONTROL database.
      CONTROL_DATABASE_URL: postgres://gbrain:${POSTGRES_PASSWORD:?required}@postgres:5432/control
      GBRAIN_VERSION: ${GBRAIN_VERSION:?required}
    command: ["bun", "run", "/app/src/ops/server.ts"]
    volumes:
      - gbrain-home:/srv/gbrain-home
      - brain-repos:/srv/brain-repos
    depends_on:
      postgres: { condition: service_healthy }
    networks: [brain-net, ops-net]

  control-plane:
    image: mobrain/control-plane:${MOBRAIN_VERSION:-${BRAINSTAND_VERSION:-dev}}
    restart: unless-stopped
    environment:
      # S2: control DB only. No GBRAIN_DATABASE_URL, no DATABASE_URL.
      CONTROL_DATABASE_URL: postgres://gbrain:${POSTGRES_PASSWORD:?required}@postgres:5432/control
      OPS_RPC_URL: http://gbrain-ops:3140
      OPS_RPC_TOKEN: ${OPS_RPC_TOKEN:?required}
      # D12: NOT `${RUNNER_TOKEN:?required}` — Compose interpolates the whole
      # file before profiles resolve, so a required variable here would break
      # `docker compose stop scheduler` on every deployment that never enables
      # the runner. The RUNTIME guard owns this instead: every runner route
      # answers `503 runner_disabled` while RUNNER_TOKEN is empty, because an
      # empty bearer must never authenticate (timingSafeEqual over two empty
      # strings would otherwise pass). Note the trailing `:-`, not `:?`.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      PUBLIC_URL: https://${DOMAIN}
      GBRAIN_HOME: /srv/gbrain-home
      GBRAIN_VERSION: ${GBRAIN_VERSION:?required}
      # D2: reconcileJournals reads the host CLI's journal from here. Fixed
      # inside the container; the bind mount below maps it to the host path.
      UPGRADE_DIR: /srv/upgrades
    command: ["bun", "run", "/app/src/control/app.ts"]
    volumes:
      # Read-only: the control plane reads config state, never writes it (S3).
      - gbrain-home:/srv/gbrain-home:ro
      # scripts/upgrade.ts runs on the Docker HOST (D1) and journals directly
      # to host disk at this path; bind-mount that host path into the
      # container, read-only, so reconcileJournals can see it without the
      # control plane ever gaining a Docker socket or CLI (S2). The left side
      # resolves on the HOST; the right side is fixed — always /srv/upgrades.
      - ${UPGRADE_DIR:-/srv/upgrades}:/srv/upgrades:ro
    depends_on:
      postgres: { condition: service_healthy }
    # D6: the runner reaches claim/heartbeat/events/finish and the model
    # gateway over runner-net, directly and never through Caddy. Every other
    # route on this surface is behind requireRole, which the runner cannot
    # satisfy; its bearer authenticates on the two token-gated routes only.
    networks: [control-net, ops-net, runner-net]

  # The scheduler. Strictly less privileged than the control plane: control-DB
  # creds and the ops bearer token, nothing else — no brain DB, no GBRAIN_HOME,
  # no brain-repos. It reaches gbrain only through the allowlisted ops RPC (S2).
  # Replicas are safe: one wins the leader advisory lock, the rest are workers.
  scheduler:
    image: mobrain/control-plane:${MOBRAIN_VERSION:-${BRAINSTAND_VERSION:-dev}}
    restart: unless-stopped
    environment:
      CONTROL_DATABASE_URL: postgres://gbrain:${POSTGRES_PASSWORD:?required}@postgres:5432/control
      OPS_RPC_URL: http://gbrain-ops:3140
      OPS_RPC_TOKEN: ${OPS_RPC_TOKEN:?required}
      PUBLIC_URL: https://${DOMAIN}
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-15000}
    command: ["bun", "run", "/app/src/scheduler/main.ts"]
    # Slice 0 measured a clean gbrain drain at 1150ms. The scheduler hosts no
    # gbrain supervisor at all, so 20s is generous; the worker's 60s is not
    # a precedent to copy.
    stop_grace_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      gbrain-ops: { condition: service_started }
    networks: [control-net, ops-net]

  # U14: the stack's FIRST hardened service — every directive below is new,
  # and each one is pinned in test/integration/compose-invariants.test.ts.
  # Profile-gated (D12): a deployment that only connects members' own agents
  # omits it and loses nothing else, so a plain `docker compose up` never
  # starts it.
  agent-runner:
    profiles: ["runner"]
    image: mobrain/agent-runner:${HARNESS_VERSION:?required}
    build:
      context: ..
      dockerfile: docker/agent-runner.Dockerfile
      args:
        HARNESS_VERSION: ${HARNESS_VERSION:?required}
    command: ["bun", "run", "/app/src/runner/main.ts"]
    # No `restart:` on purpose. The process refuses to start without
    # RUNNER_TOKEN (Task 8's guard), and a restart policy would turn that
    # explicit misconfiguration into an endless crash loop that hides the
    # error. An exited container plus the `never_claimed` health state is the
    # honest signal; the operator starts the runner with the profile.
    environment:
      # D12: `${RUNNER_TOKEN:-}`, never `${RUNNER_TOKEN:?required}` — Compose
      # interpolates this whole file before profiles resolve, so a required
      # variable would break `docker compose stop scheduler` on every
      # runner-less deployment. The runtime guards own it: the control plane
      # answers `503 runner_disabled` while it is empty (an empty bearer must
      # never authenticate — timingSafeEqual on two empty strings would pass),
      # and this process exits non-zero without it.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      CONTROL_URL: http://control-plane:3150
      HARNESS_VERSION: ${HARNESS_VERSION:?required}
    # The fence (D6) is the network, not the tool flags (honesty rule 2).
    read_only: true
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    # D13: long enough for an in-flight harness to be SIGTERMed and its
    # gbrain token revoked on the way out.
    stop_grace_period: 60s
    # P5 (Task 1): a tmpfs at /tmp ALONE is the minimal writable set for a
    # `-p` harness run, and /workspace is not needed either — the per-run
    # workspace directory is created under /tmp by the runner process and
    # destroyed on every exit path. The harness lives at
    # /opt/harness/bin/claude (BUN_INSTALL=/opt/harness), not under any $HOME,
    # so no $HOME tmpfs is required.
    tmpfs: [/tmp]
    volumes: []   # none. Ever.
    networks: [runner-net]

networks:
  brain-net: { driver: bridge }
  control-net: { driver: bridge }
  # Carries only control-plane → gbrain-ops RPC.
  ops-net: { driver: bridge }
  # D6: the fence. `internal: true` removes the gateway, so this network has
  # no route out and the runner has no default route at all — the only things
  # it can address are the peers named here. Members: agent-runner (this one
  # network, nothing else), caddy (aliased to ${DOMAIN} so
  # https://${DOMAIN}/mcp resolves, which keeps X-Forwarded-For Caddy's job),
  # and control-plane (the claim/heartbeat/events/finish and gateway routes,
  # never routed publicly — Caddy gains no route for them).
  runner-net:
    driver: bridge
    internal: true

volumes:
  pg-data:
  gbrain-home:
  brain-repos:
  caddy-data:
  caddy-config:
