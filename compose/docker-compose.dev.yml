# Local override: publishes Caddy on high ports so `docker compose up` is
# reachable without binding 80/443. NEVER used in production.
#
# This does NOT supply DOMAIN. `${DOMAIN:?required}` in the base compose
# file (docker-compose.yml) is interpolated BEFORE this override is merged
# in, so a value set only here can never satisfy it -- Compose still fails
# fast if DOMAIN is unset, by design (see Task 1 controller ruling: that
# early, explicit failure is intentional and must not be relaxed). Export
# DOMAIN=localhost yourself (shell env or .env) before bringing this stack
# up; when Caddy sees a non-public DOMAIN like `localhost` it issues
# certificates from its own internal CA instead of trying ACME.
services:
  caddy:
    ports:
      - "8443:443"
      - "8080:80"

  # Host-run tests and scripts/backup.ts reach the RPC over localhost. In
  # production nothing but control-plane can reach :3140, on ops-net only.
  # The Task 1 invariant test reads docker-compose.yml alone, so this override
  # does not weaken it.
  gbrain-ops:
    ports:
      - "3140:3140"

  # The scheduler deliberately has NO entry here: it is a background loop with
  # no HTTP surface, so there is nothing to publish and nothing to make
  # reachable from the host. It reaches gbrain-ops over ops-net and postgres
  # over control-net exactly as in production. Do not add a `ports:` block for
  # it — `caddy` is the only host-port publisher in the stack.

  # ---------------------------------------------------------------------
  # Runner lane — dev only (profile `runner`, so a plain `up` never starts
  # any of this).
  #
  # With DOMAIN=localhost Caddy issues certificates from its own internal CA
  # instead of ACME, and the runner's Node process has to trust that CA to
  # speak https://${DOMAIN}/mcp. Production validates normally, so
  # NODE_EXTRA_CA_CERTS exists ONLY in this file: trusting a local CA in
  # production is a trust downgrade, not a convenience.
  #
  # Caddy writes /data/caddy/pki/authorities/local/{root,intermediate}.crt as
  # root-owned mode 0600 inside a mode 0700 directory (verified in the running
  # brainstand-caddy-1 container). The runner is uid 10001 with cap_drop ALL,
  # so mounting that path straight out of the caddy-data volume yields
  # "Permission denied" — measured, not assumed. This one-shot runs as root,
  # copies root+intermediate into a dev-only volume as mode 0644, and exits;
  # agent-runner then mounts that copy read-only.
  # ---------------------------------------------------------------------
  caddy-ca-export:
    profiles: ["runner"]
    image: busybox:1.36
    # It needs no interface at all: it only reads the caddy-data volume.
    network_mode: none
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >
        i=0;
        while [ ! -f /caddy-data/caddy/pki/authorities/local/root.crt ] && [ "$$i" -lt 30 ]; do i=$$((i+1)); sleep 1; done;
        cat /caddy-data/caddy/pki/authorities/local/root.crt
        /caddy-data/caddy/pki/authorities/local/intermediate.crt
        > /export/caddy-root.crt;
        chmod 0644 /export/caddy-root.crt;
        ls -l /export
    volumes:
      - caddy-data:/caddy-data:ro
      - runner-ca:/export

  agent-runner:
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/caddy-root.crt
    depends_on:
      caddy-ca-export: { condition: service_completed_successfully }
    volumes:
      # `subpath` (not a plain `runner-ca:/etc/ssl/caddy-root.crt` mount):
      # a named volume mounted onto a file path is created as a DIRECTORY,
      # and Node would then be handed a directory. The subpath mount produces
      # a real read-only file. The source path is a dev-only copy because the
      # original is 0600 root — see caddy-ca-export above.
      - type: volume
        source: runner-ca
        target: /etc/ssl/caddy-root.crt
        read_only: true
        volume:
          subpath: caddy-root.crt

volumes:
  # Dev-only. Holds the mode-0644 copy of Caddy's internal CA chain that
  # caddy-ca-export refreshes on every `up`; never referenced in production.
  runner-ca:
